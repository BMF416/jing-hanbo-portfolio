<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="荆涵博的文创设计、包装设计、活动视觉与部分获奖记录">
  <link rel="canonical" href="https://jing-hanbo-portfolio.vercel.app/design-case.html">
  <title>设计作品与荣誉 — JING HANBO</title>
  <link rel="stylesheet" href="design-case.css">
  <script src="design-case.js" defer></script>
</head>
<body>
  <main class="design-page">
    <header class="design-header">
      <a href="index.html#work">← 返回成果展示</a>
      <span>JING HANBO / PORTFOLIO</span>
      <span>CASE 03 / DESIGN</span>
    </header>

    <section class="design-hero" aria-labelledby="design-title">
      <p class="design-eyebrow">SELECTED WORKS / RECOGNITION</p>
      <h1 id="design-title">设计作品与荣誉</h1>
      <p class="design-intro">在校期间完成的部分文创、包装与活动视觉设计，以及部分获奖记录。</p>
    </section>

    <section class="design-section" aria-labelledby="creative-title">
      <div class="design-section-heading"><span>01 / CULTURAL & CREATIVE</span><h2 id="creative-title">文创设计</h2></div>
      <figure class="design-figure">
        <button class="design-image-trigger" type="button" aria-label="放大查看文创设计组合图">
          <img src="assets/design/1.png" alt="文创设计组合图" width="1536" height="1024" decoding="async">
        </button>
        <figcaption>文创设计组合图</figcaption>
      </figure>
    </section>

    <section class="design-section" aria-labelledby="package-title">
      <div class="design-section-heading"><span>02 / PACKAGING</span><h2 id="package-title">包装设计</h2></div>
      <figure class="design-figure">
        <button class="design-image-trigger" type="button" aria-label="放大查看山药粉包装设计">
          <img src="assets/design/5.png" alt="山药粉包装设计组合图" width="1536" height="1024" loading="lazy" decoding="async">
        </button>
        <figcaption>山药粉包装设计</figcaption>
      </figure>
    </section>

    <section class="design-section" aria-labelledby="campaign-title">
      <div class="design-section-heading"><span>03 / CAMPAIGN VISUALS</span><h2 id="campaign-title">活动视觉设计</h2></div>
      <div class="design-grid">
        <figure class="design-figure">
          <button class="design-image-trigger" type="button" aria-label="放大查看蓝橙色 618 活动视觉">
            <img src="assets/design/4.jpg" alt="蓝橙色 618 活动视觉组合图" width="800" height="668" loading="lazy" decoding="async">
          </button>
          <figcaption>蓝橙色 618 活动视觉</figcaption>
        </figure>
        <figure class="design-figure">
          <button class="design-image-trigger" type="button" aria-label="放大查看紫色 618 活动视觉">
            <img src="assets/design/3.jpg" alt="紫色 618 活动视觉组合图" width="715" height="800" loading="lazy" decoding="async">
          </button>
          <figcaption>紫色 618 活动视觉</figcaption>
        </figure>
        <figure class="design-figure">
          <button class="design-image-trigger" type="button" aria-label="放大查看金色中秋活动视觉">
            <img src="assets/design/2.jpg" alt="金色中秋活动视觉组合图" width="600" height="800" loading="lazy" decoding="async">
          </button>
          <figcaption>金色中秋活动视觉</figcaption>
        </figure>
        <figure class="design-figure">
          <button class="design-image-trigger" type="button" aria-label="放大查看中秋游戏活动视觉">
            <img src="assets/design/6.png" alt="中秋游戏活动视觉组合图" width="598" height="759" loading="lazy" decoding="async">
          </button>
          <figcaption>中秋游戏活动视觉</figcaption>
        </figure>
      </div>
    </section>

    <section class="design-section design-awards" aria-labelledby="awards-title">
      <div class="design-section-heading"><span>04 / RECOGNITION</span><h2 id="awards-title">获奖记录</h2></div>
      <figure class="design-figure">
        <button class="design-image-trigger" type="button" aria-label="放大查看获奖证书组合图">
          <img src="assets/design/7.png" alt="多张获奖证书的组合图，包含个人及团队相关记录" width="2560" height="1600" loading="lazy" decoding="async">
        </button>
        <figcaption>获奖证书组合图</figcaption>
      </figure>
    </section>
    <footer class="design-footer"><a href="index.html#work">← 返回成果展示</a><span>JING HANBO / PORTFOLIO</span></footer>
  </main>

  <dialog class="design-lightbox" id="design-lightbox" aria-labelledby="lightbox-title">
    <div class="design-lightbox-toolbar">
      <strong id="lightbox-title"></strong>
      <div>
        <button class="design-zoom-toggle" type="button" aria-pressed="false">查看原尺寸</button>
        <button class="design-lightbox-close" type="button" aria-label="关闭大图">×</button>
      </div>
    </div>
    <div class="design-lightbox-stage"><img alt=""></div>
  </dialog>
</body>
</html>
